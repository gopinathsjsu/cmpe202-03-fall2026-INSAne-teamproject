name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  deploy:
    name: Build, publish, and deploy backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" ./backend
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy image through AWS Systems Manager
        id: deploy
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          ASG_NAME: ${{ vars.BACKEND_ASG_NAME }}
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          test -n "$INSTANCE_IDS"

          COMMANDS=$(cat <<EOF
          set -eu
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$(echo "$IMAGE_URI" | cut -d/ -f1)"
          docker pull "$IMAGE_URI"
          docker rm -f insane-stays-backend || true
          test -f /etc/insane-stays/backend.env
          docker run -d --name insane-stays-backend --restart unless-stopped \
            --env-file /etc/insane-stays/backend.env \
            -p 5001:5001 "$IMAGE_URI"
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Insane Stays backend $GITHUB_SHA" \
            --parameters commands="$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
          done

      - name: Verify backend health
        env:
          HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          curl --fail --retry 10 --retry-delay 5 "$HEALTHCHECK_URL/api/health"
